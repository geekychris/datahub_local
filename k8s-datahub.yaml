---
apiVersion: v1
kind: Namespace
metadata:
  name: datahub

---
# PostgreSQL Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:14
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: datahub
        - name: POSTGRES_PASSWORD
          value: datahub
        - name: POSTGRES_DB
          value: datahub
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    nodePort: 30432

---
# Elasticsearch Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
      - name: elasticsearch
        image: elasticsearch:7.17.9
        ports:
        - containerPort: 9200
        env:
        - name: discovery.type
          value: single-node
        - name: xpack.security.enabled
          value: "false"
        - name: ES_JAVA_OPTS
          value: "-Xms512m -Xmx512m"
        volumeMounts:
        - name: es-storage
          mountPath: /usr/share/elasticsearch/data
      volumes:
      - name: es-storage
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: elasticsearch
  ports:
  - port: 9200
    targetPort: 9200
    nodePort: 30920

---
# Zookeeper Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: confluentinc/cp-zookeeper:7.4.0
        ports:
        - containerPort: 2181
        env:
        - name: ZOOKEEPER_CLIENT_PORT
          value: "2181"
        - name: ZOOKEEPER_TICK_TIME
          value: "2000"

---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
    nodePort: 30218

---
# Kafka Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: confluentinc/cp-kafka:7.4.0
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper:2181
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://kafka:9092
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "1"

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092
    nodePort: 30909

---
# Schema Registry Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: schema-registry
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schema-registry
  template:
    metadata:
      labels:
        app: schema-registry
    spec:
      containers:
      - name: schema-registry
        image: confluentinc/cp-schema-registry:7.4.0
        ports:
        - containerPort: 8081
        env:
        - name: SCHEMA_REGISTRY_HOST_NAME
          value: schema-registry
        - name: SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS
          value: kafka:9092
        - name: SCHEMA_REGISTRY_LISTENERS
          value: http://0.0.0.0:8081

---
apiVersion: v1
kind: Service
metadata:
  name: schema-registry
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: schema-registry
  ports:
  - port: 8081
    targetPort: 8081
    nodePort: 30808

---
# DataHub GMS Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub-gms
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datahub-gms
  template:
    metadata:
      labels:
        app: datahub-gms
    spec:
      containers:
      - name: datahub-gms
        image: acryldata/datahub-gms:latest
        ports:
        - containerPort: 8080
        env:
        - name: EBEAN_DATASOURCE_USERNAME
          value: datahub
        - name: EBEAN_DATASOURCE_PASSWORD
          value: datahub
        - name: EBEAN_DATASOURCE_HOST
          value: postgres:5432
        - name: EBEAN_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/datahub
        - name: EBEAN_DATASOURCE_DRIVER
          value: org.postgresql.Driver
        - name: KAFKA_BOOTSTRAP_SERVER
          value: kafka:9092
        - name: KAFKA_SCHEMAREGISTRY_URL
          value: http://schema-registry:8081
        - name: ELASTICSEARCH_HOST
          value: elasticsearch
        - name: ELASTICSEARCH_PORT
          value: "9200"

---
apiVersion: v1
kind: Service
metadata:
  name: datahub-gms
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: datahub-gms
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30080

---
# DataHub Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datahub-frontend
  namespace: datahub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: datahub-frontend
  template:
    metadata:
      labels:
        app: datahub-frontend
    spec:
      containers:
      - name: datahub-frontend
        image: acryldata/datahub-frontend-react:latest
        ports:
        - containerPort: 9002
        env:
        - name: DATAHUB_GMS_HOST
          value: datahub-gms
        - name: DATAHUB_GMS_PORT
          value: "8080"
        - name: DATAHUB_SECRET
          value: YouMustChangeThisSecretValue
        - name: DATAHUB_APP_VERSION
          value: "1.0"

---
apiVersion: v1
kind: Service
metadata:
  name: datahub-frontend
  namespace: datahub
spec:
  type: NodePort
  selector:
    app: datahub-frontend
  ports:
  - port: 9002
    targetPort: 9002
    nodePort: 30002
